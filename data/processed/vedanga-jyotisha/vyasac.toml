[workspace]
name = "vedanga-jyotisha"
title = "वेदाङ्गज्योतिषम्"
description = "Vedāṅga Jyotiṣa (Ārca + Yājuṣa) from Sanskrit Wikisource"

[catalog]
type = "work"
language = "sa"
license = "CC-BY-SA-4.0"

[publish]
publisher_dir = "../../../sa_wikisource"

[urn]
path_schema = ["chapter"]
corpus = "vedanga-jyotisha"
hierarchy = ["chapter", "shloka"]

[build.default]
layout = "sequence"
target = "view"
publisher_css = ["styles/indic-verse.css"]
css = ["templates/html/theme.css", "templates/html/reading.css"]

[streams.primary]
path = "content/sutra"
segment_separator = "\n"
language = "sa"
script = "Deva"
kind = "source"
