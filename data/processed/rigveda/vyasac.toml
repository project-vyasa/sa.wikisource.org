[workspace]
name = "rigveda"
title = "ऋग्वेदः"
description = "Rig Veda Samhita, Padapatha, and Sayanacharya Bhashya from Sanskrit Wikisource"

[publish]
publisher_dir = "../../../"

[urn]
path_schema = ["mandala", "sukta"]
corpus = "rv"
hierarchy = ["mandala", "sukta", "rik"]

[build.default]
layout = "sequence"
target = "view"
streams = ["primary", "padapatha", "sayana"]

[streams]
primary = { path = "content/samhita", segment_separator = "\n" }
padapatha = { path = "content/padapatha", segment_separator = " " }
sayana = { path = "content/sayana", segment_separator = "\n" }
