[workspace]
name = "rigveda"
title = "ऋग्वेदः"
description = "Rig Veda Samhita, Padapatha, and Sayanacharya Bhashya from Sanskrit Wikisource"

[catalog]
type = "work"
language = "sa"
license = "CC-BY-SA-4.0"

[publish]
publisher_dir = "../../../sa_wikisource"

[urn]
path_schema = ["mandala", "sukta"]
corpus = "rv"
hierarchy = ["mandala", "sukta", "rik"]

[build.default]
layout = "sequence"
target = "view"
# Packed folder names (also accepts TOML keys). Order is grid / streams_config order.
streams = ["samhita", "padapatha", "sayana"]
publisher_css = ["styles/indic-verse.css"]
css = ["templates/html/theme.css", "templates/html/reading.css"]

[streams.primary]
path = "content/samhita"
segment_separator = "\n"

[streams.padapatha]
path = "content/padapatha"
segment_separator = " "

[streams.sayana]
path = "content/sayana"
segment_separator = "\n"
