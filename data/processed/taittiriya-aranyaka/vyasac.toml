[workspace]
name = "taittiriya-aranyaka"
title = "तैत्तिरीयारण्यकम्"
description = "Taittirīya Āraṇyaka from Sanskrit Wikisource (accented, 8 praśnas). Śikṣāvallī is praśna 5; Mahānārāyaṇa is praśna 6; Puruṣa sūkta is 3.12. The Brahmānanda and Bhṛgu vallīs of 10-prapāṭhaka printed editions are not in this source."

